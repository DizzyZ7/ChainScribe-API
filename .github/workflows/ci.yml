name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-django-secret-key-not-used-outside-actions
  JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-used-outside-actions
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  POSTGRES_DB: chainscribe_test
  POSTGRES_USER: chainscribe
  POSTGRES_PASSWORD: chainscribe-ci
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://127.0.0.1:6379/0
  RATE_LIMIT_ENABLED: "false"

jobs:
  quality-and-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: chainscribe_test
          POSTGRES_USER: chainscribe
          POSTGRES_PASSWORD: chainscribe-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chainscribe -d chainscribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Django checks
        run: python manage.py check
      - name: Test with coverage
        run: |
          coverage run manage.py test --verbosity=2
          coverage xml
          coverage report --fail-under=90
      - name: Dependency audit
        run: pip-audit --requirement requirements/base.txt

  python-310:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: chainscribe_test
          POSTGRES_USER: chainscribe
          POSTGRES_PASSWORD: chainscribe-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chainscribe -d chainscribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install --requirement requirements/base.txt
      - run: python manage.py test

  container-smoke:
    runs-on: ubuntu-24.04
    needs: [quality-and-tests, python-310]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --detach --build
      - name: Wait for healthy API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Critical journey smoke test
        run: python scripts/smoke_test.py
      - name: Show service state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
