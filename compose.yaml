name: chainscribe

services:
  db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chainscribe
      POSTGRES_USER: chainscribe
      POSTGRES_PASSWORD: chainscribe-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainscribe -d chainscribe"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: development-only-django-key-never-use-this-in-production
      JWT_SIGNING_KEY: development-only-jwt-key-never-use-this-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      API_DOCS_ENABLED: "true"
      POSTGRES_DB: chainscribe
      POSTGRES_USER: chainscribe
      POSTGRES_PASSWORD: chainscribe-local
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      RUN_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks: [backend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
