[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chainscribe-api"
version = "1.0.0"
description = "Security-focused Django Ninja backend for a publishing platform"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "DJ", "RUF", "UP", "S"]
ignore = [
  "DJ001",
  "DJ008",
  "S101",
  "S105",
  "S106",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "S105", "S106"]
"**/admin.py" = ["RUF012"]
"**/models.py" = ["RUF012"]
"config/settings/*.py" = ["F403", "F405"]
"gunicorn.conf.py" = ["S104"]

[tool.coverage.run]
branch = true
source = ["accounts", "audit", "blog", "config", "core"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "config/asgi.py",
  "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
